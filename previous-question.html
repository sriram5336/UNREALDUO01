<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Previous Year Question Papers | Saranathan College</title>
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- Page Loader -->
  <div class="preloader">
    <div class="loader-spinner"></div>
    <div class="loader-text">SEARCHING EXAM PAPERS ARCHIVE</div>
  </div>

  <canvas class="particle-canvas"></canvas>
  <div class="circle-glow"></div>

  <!-- Header -->
  <header></header>

  <main class="container" style="min-height: 85vh;">
    
    <section class="animate-slide-up" style="margin-bottom:40px; text-align:center;">
      <h1 style="font-family:var(--font-title); font-size:2.5rem; font-weight:800;">Previous Year Question Papers</h1>
      <p style="color:var(--text-secondary); margin-top:5px; font-size:14px;">Study exam regulations and download PYQs archive files.</p>
    </section>

    <!-- Table Roster -->
    <section class="animate-fade-in delay-2" style="max-width:900px; margin:0 auto;">
      <div class="data-table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Course Subject</th>
              <th>Year</th>
              <th>Regulation</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><strong>Operating Systems</strong></td>
              <td>2025</td>
              <td>R-2021</td>
              <td><button class="form-submit-btn" style="padding:6px 14px; font-size:11px;" onclick="window.location.href='login.html'">Download PDF</button></td>
            </tr>
            <tr>
              <td><strong>Database Management Systems</strong></td>
              <td>2025</td>
              <td>R-2021</td>
              <td><button class="form-submit-btn" style="padding:6px 14px; font-size:11px;" onclick="window.location.href='login.html'">Download PDF</button></td>
            </tr>
            <tr>
              <td><strong>Electronic Devices and Circuits</strong></td>
              <td>2024</td>
              <td>R-2021</td>
              <td><button class="form-submit-btn" style="padding:6px 14px; font-size:11px;" onclick="window.location.href='login.html'">Download PDF</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer></footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
</body>
</html>
