<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Campus Map & Navigation | Saranathan College</title>
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- Page Loader -->
  <div class="preloader">
    <div class="loader-spinner"></div>
    <div class="loader-text">LOADING NAVIGATION SYSTEMS</div>
  </div>

  <canvas class="particle-canvas"></canvas>
  <div class="circle-glow"></div>

  <!-- Header -->
  <header></header>

  <main class="container" style="padding-top:100px; display:flex; gap:30px; flex-wrap:wrap; min-height:85vh;">
    
    <!-- Controls Sidebar -->
    <div class="glass-card animate-slide-right" style="flex:1; min-width:320px; max-width:400px; display:flex; flex-direction:column; gap:20px;">
      <h2 style="font-family: var(--font-title); font-size:20px; font-weight:700;">
        <i class="bx bx-compass" style="color:var(--color-primary); vertical-align:middle; margin-right:5px;"></i> Campus Pathfinder
      </h2>
      <p style="font-size:12px; color:var(--text-secondary); line-height:1.5;">Select locations to map the optimal pedestrian route on campus.</p>
      
      <div class="form-group">
        <label for="route-source">Source Point</label>
        <select id="route-source" class="form-input" style="background-color: var(--bg-page); cursor:pointer;">
          <option value="Main Gate">Main Entrance Gate</option>
          <option value="Admin Block">Admin Block</option>
          <option value="Library">Central Library</option>
          <option value="CSE Block">CSE Block</option>
          <option value="ECE Block">ECE Block</option>
          <option value="Hostel Block">Hostel Block</option>
          <option value="Auditorium">Auditorium</option>
          <option value="Canteen">Campus Canteen</option>
          <option value="Placement Cell">Placement Cell</option>
          <option value="Playground">Playground</option>
        </select>
      </div>

      <div class="form-group">
        <label for="route-dest">Destination</label>
        <select id="route-dest" class="form-input" style="background-color: var(--bg-page); cursor:pointer;">
          <option value="Main Gate">Main Entrance Gate</option>
          <option value="Library">Central Library</option>
          <option value="Admin Block">Admin Block</option>
          <option value="CSE Block">CSE Block</option>
          <option value="ECE Block">ECE Block</option>
          <option value="Hostel Block">Hostel Block</option>
          <option value="Auditorium">Auditorium</option>
          <option value="Canteen">Campus Canteen</option>
          <option value="Placement Cell">Placement Cell</option>
          <option value="Playground">Playground</option>
        </select>
      </div>

      <button id="find-route-btn" class="form-submit-btn" style="width:100%; display:flex; justify-content:center; gap:8px;">
        <i class="bx bx-navigation"></i> Start Navigation
      </button>

      <!-- Navigation Output Card -->
      <div id="navigation-output" class="glass-card" style="display:none; padding:15px; border-color:var(--color-secondary); background:rgba(16, 185, 129, 0.03);">
        <h4 style="font-family:var(--font-title); font-size:14px; font-weight:700; color:var(--color-secondary); display:flex; align-items:center; gap:8px;">
          <i class="bx bx-check-circle"></i> Optimal Route Found
        </h4>
        <div style="font-size:12px; color:var(--text-secondary); margin-top:8px; line-height:1.6;">
          <p id="nav-dist-text">Distance: 180 meters</p>
          <p id="nav-time-text">Estimated time: 2 mins (Walk)</p>
          <p id="nav-path-text" style="color:var(--text-primary); font-weight:500; margin-top:5px;"></p>
        </div>
      </div>

    </div>

    <!-- Map Viewport -->
    <div class="glass-card animate-scale-in delay-1" style="flex:2; min-width:450px; position:relative; overflow:hidden; padding:10px; min-height:550px; display:flex; justify-content:center; align-items:center; background-color: #06060c;">
      
      <!-- Canvas representing 2D campus vector map -->
      <canvas id="map-canvas" style="width:100%; height:100%; min-height:500px; display:block; border-radius:12px;"></canvas>

    </div>

  </main>

  <footer></footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/map2d.js"></script>
</body>
</html>
